[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booksaver-agent"
version = "0.1.0"
description = "Local daemon that monitors Booking.com hotel prices for refundable reservations"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",   # browser automation (ADR-007); run `playwright install chromium`
    "anthropic>=0.40",    # LLM extraction fallback (ADR-009)
    "cryptography>=42",   # Fernet encryption of personal Anthropic keys at rest (ADR-019)
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "mypy"]

[project.scripts]
booksaver = "booksaver.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"booksaver.infrastructure.persistence" = ["schema.sql"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
