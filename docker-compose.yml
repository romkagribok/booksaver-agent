services:
  booksaver:
    build: .
    image: booksaver-agent:latest
    container_name: booksaver
    restart: unless-stopped
    init: true # reap zombie chromium processes cleanly on restart
    environment:
      # Secrets: set these in a local .env file (never commit it) or export
      # them in the host shell before `docker compose up`. See
      # memory-bank/operations/vps-deployment-runbook.md for the full list
      # and how to generate BOOKSAVER_SECRET_KEY.
      - BOOKSAVER_TELEGRAM_BOT_TOKEN=${BOOKSAVER_TELEGRAM_BOT_TOKEN:?set in .env}
      - BOOKSAVER_LLM_API_KEY=${BOOKSAVER_LLM_API_KEY:?set in .env}
      - BOOKSAVER_SECRET_KEY=${BOOKSAVER_SECRET_KEY:?set in .env}
      # Optional: email notifications alongside/instead of Telegram.
      - BOOKSAVER_SMTP_PASSWORD=${BOOKSAVER_SMTP_PASSWORD:-}
    volumes:
      - booksaver-data:/data
    # Chromium is the memory-hungry part of this container: a single headless
    # tab routinely spikes to 300-500MB RSS during a check, on top of the
    # ~100-150MB Python/Playwright baseline. The optional headed authentication
    # stack overlaps briefly with the daemon and display processes, so 2GB is
    # the supported floor; size up if you see OOMKilled in `docker inspect`.
    mem_limit: 2g
    memswap_limit: 3g
    shm_size: 1g
    expose:
      # Compose-internal only. Caddy publishes HTTPS when the remote-auth
      # profile is explicitly enabled; raw gateway/VNC proxy ports never bind
      # to the host.
      - "8080"
      - "6080"
    # Stop is honored between scheduler jobs (ADR-006): an in-flight browser
    # check finishes first (bounded by [agent] check_timeout_seconds, default
    # 180s). Give SIGTERM that long before Docker escalates to SIGKILL.
    stop_grace_period: 200s
    healthcheck:
      # Freshness probe against /data/heartbeat, which the daemon's main
      # thread refreshes every ~15s while all its threads (scheduler +
      # Telegram poller) are alive and healthy (daemon/lifecycle.py). A hung
      # or crashed thread stops the refresh; three stale probes in a row mark
      # the container unhealthy so the restart policy can recover it.
      test: ["CMD-SHELL", "test -f /data/heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /data/heartbeat))) -lt 120"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    container_name: booksaver-caddy
    profiles: ["remote-auth"]
    restart: unless-stopped
    depends_on:
      booksaver:
        condition: service_healthy
    environment:
      - BOOKSAVER_AUTH_DOMAIN=${BOOKSAVER_AUTH_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  booksaver-data:
  caddy-data:
  caddy-config:
